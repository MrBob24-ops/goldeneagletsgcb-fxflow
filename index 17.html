:root{
  --gold:#F0C550; --slate:#3F4651; --navy:#34414E; --heading:#212529; --body:#6C757D;
  --bg:#F8F9FA; --border:#E9ECEF; --cream:#FDF8E8; --success:#2E9E5B; --alert:#D64545;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Open Sans',Arial,sans-serif;background:#15181c;color:#fff;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}

/* presenter rail */
.rail{width:232px;flex:none;padding:28px 20px;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px;overflow:auto}
.rail-title{font-weight:700;font-size:15px;color:#fff}
.rail-sub{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:22px 0 8px}
.rail-item{font-size:13px;line-height:20px;padding:7px 10px;border-radius:6px;color:rgba(255,255,255,.7)}
.rail-item:hover{background:rgba(255,255,255,.06)}
.rail-item.on{background:rgba(240,197,80,.16);color:var(--gold);font-weight:600}
.rail-toggle{margin-top:18px;font-size:13px;font-weight:600;padding:9px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);text-align:center;color:#fff}
.rail-toggle:hover{background:rgba(255,255,255,.06)}
.rail-hint{font-size:12px;line-height:18px;color:rgba(255,255,255,.45);margin:18px 0 0}

.canvas{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.device{width:393px;height:852px;flex:none;border-radius:28px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 10px #0b0d0f,0 0 0 11px rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.5);
  transform:scale(var(--s,1));transform-origin:center}
.viewport{position:relative;width:100%;height:100%;overflow:hidden}
.slot{display:contents}
.slot-name{display:none}

/* frames */
.frame{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;background:var(--bg);color:var(--heading);
  font-size:16px;line-height:26px;scrollbar-width:none}
.frame::-webkit-scrollbar{display:none}
.frame.active{display:block}
.frame.enter-fwd{z-index:3;animation:inR .3s ease-out both}
.frame.enter-back{z-index:3;animation:inL .3s ease-out both}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes inL{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.frame.enter-fwd,.frame.enter-back{animation-duration:1ms}}

/* text styles */
.h1{font-weight:800;font-size:32px;line-height:38px;margin:0;text-align:center;color:var(--heading)}
.h2{font-weight:700;font-size:22px;line-height:28px;margin:0;color:var(--heading)}
.body{font-weight:400;font-size:16px;line-height:26px;margin:0}
.small{font-weight:400;font-size:14px;line-height:20px;margin:0}
.muted{color:var(--body)}
.center{text-align:center}
.white{color:#fff}

/* header */

.hdr-title{font-family:'Open Sans',Arial,sans-serif;font-weight:800;font-size:22px;line-height:26px;letter-spacing:.01em;color:#fff;white-space:nowrap}
.proto-tag{font-size:10px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
  border:1px solid rgba(240,197,80,.65);border-radius:100px;padding:1px 7px}
.menu{margin-left:auto;width:40px;height:36px;flex:none;border:1px solid rgba(255,255,255,.25);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.menu i{display:block;width:18px;height:2px;border-radius:1px;background:#fff}

/* layouts */
.stack{display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 16px 40px}
.stack.done-screen{padding-top:56px}
.content{display:flex;flex-direction:column;padding:20px 16px 40px}
.content.track{padding-top:32px}
.sub{margin-top:6px}
.list{display:flex;flex-direction:column;margin-top:20px}
.gap12{gap:12px}.gap14{gap:14px}
.content>.btn{margin-top:24px}.content>.btn+.btn{margin-top:12px}

/* badge */
.badge{font-weight:600;font-size:14px;line-height:20px;color:var(--heading);background:var(--gold);border-radius:100px;padding:8px 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:400;font-size:16px;line-height:26px;
  padding:14px 24px;border-radius:8px;background:var(--navy);color:#fff;border:1px solid var(--navy);transition:filter .12s}
.btn:hover{filter:brightness(1.12)}
.btn.secondary{background:#fff;color:var(--navy)}
.btn.secondary:hover{filter:none;background:#f3f5f7}
.btn.w-281{width:281px;max-width:100%}
.btn.w-full{width:100%}
.btn.disabled{opacity:.4;cursor:default;filter:none}
.arr{display:inline-flex}
.arr svg{width:.85em;height:.85em}

/* list card */
.card{width:100%;display:flex;align-items:center;gap:16px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:12px}
.card.selected{background:var(--cream);border:2px solid var(--gold);padding:15px}
.circle{width:36px;height:36px;flex:none;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center}
.circle svg{width:16px;height:16px}
.card-text{min-width:0;flex:1}
.card-title{font-weight:600;font-size:16px;line-height:22px;color:var(--heading)}

/* step header */
.step{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:24px}
.back{display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--heading)}
.step-label{font-weight:600;font-size:12px;line-height:16px;color:var(--body);margin-top:12px;letter-spacing:.02em}
.bar{width:100%;height:6px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
.bar span{display:block;height:6px;border-radius:3px;background:var(--gold);max-width:100%}

/* input field */
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-weight:600;font-size:14px;line-height:20px;color:var(--heading)}
.field-box{height:48px;display:flex;align-items:center;padding:0 14px;background:#fff;border:1px solid var(--border);border-radius:8px;
  font-size:16px;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* document row */
.doc{display:flex;align-items:center;gap:16px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:12px}
.dot28{width:28px;height:28px;flex:none;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center}
.dot28 svg{width:13px;height:13px}
.doc .status{color:var(--success);flex:none}
.doc.missing{border-color:var(--alert);cursor:pointer}
.doc.missing:hover{background:#fff8f8}
.doc.missing .dot28{background:var(--alert)}
.doc.missing .card-title,.doc.missing .status{color:var(--alert)}
.banner{margin-top:16px;padding:14px;background:var(--cream);border:1px solid var(--gold);border-radius:8px;color:var(--heading)}
.banner.ok{border-color:var(--success)}

/* review */
.summary{margin-top:20px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:4px 16px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.val{font-weight:600;font-size:14px;line-height:20px;color:var(--heading);text-align:right}
.confirm{display:flex;align-items:center;gap:10px;margin-top:20px}
.tick{width:20px;height:20px;flex:none;border-radius:4px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg{width:11px;height:11px}

/* grouped form sections */

">Refresh status</button><div class="demo">Demo: links and statuses are stored in this browser only. Open a link in a new tab, or here, to act as that signatory. This screen updates when they submit. A link opened on another device or browser will not find the session, because the prototype has no backend.</div></div>`};

const vsigUI=n=>{const up=S.vsMode==='up',pad=up?(S.vsU?`<img class="sigimg" src="${S.vsU}" alt="Uploaded signature"><label class="edit" for="sigfile">Replace image</label>`:`<label class="btn secondary" for="sigfile">Choose a signature image</label>`):`<canvas id="pad" class="pad" width="330" height="140" data-k="vsD" aria-label="Signature area"></canvas><button class="edit" data-act="vclear">Clear</button>`;return `<h2 class="h2">Add your signature</h2><p class="small muted sub">This signature is saved against Signatory ${n} only.</p><div class="tog"><button class="btn ${up?'secondary':''}" data-act="vtab:draw">Draw signature</button><button class="btn ${up?'':'secondary'}" data-act="vtab:up">Upload signature</button></div><input type="file" id="sigfile" data-k="vsU" data-ok="vsOk" accept="image/png,image/jpeg" hidden><div style="margin-top:12px">${pad}</div>${err('sig')}<div class="sect" style="margin-top:12px">${up?req('Signed on a clear piece of paper','Plain, clean paper with no lines, creases or shadows')+req('Clear and legible','In focus and well lit, with the whole signature visible'):req('Clear and legible','Sign with your finger or mouse, large enough to read')}</div>${up?`<button class="confirm" data-act="vsigok"><span class="tick">${S.vsOk?CHK:''}</span><span class="small">I confirm my signature is on clear paper and legible.</span></button>`:''}<button class="edit" data-act="vsample">Use a sample signature (demo)</button>${btn('Continue','vsign','w-full')}`};
const sigvUI=()=>{const R=msLoad(),i=sigIdx(R,S.vtok),g=i<0?null:R.sigs[i];
if(!g)return `<div class="content track"><h2 class="h2">Signatory Verification</h2><div class="banner">This verification link isn’t active in this browser. In this prototype, links only work in the browser where the transfer was started, because there is no backend. Ask the person who started the transfer to resend it.</div>${btn('Back to Home','go:home','secondary w-full')}</div>`;
const n=i+1,k=S.vstep||0,a=String(R.acct||'').slice(-4),nm=(R.ctx&&R.ctx.aname)||'',row=(x,y)=>`<div class="row"><span class="small muted">${x}</span><span class="val">${e(y)}</span></div>`;
if(k>=5||g.st==='done')return `<div class="stack done-screen"><span class="big-circle">${CHK}</span><h1 class="h1">Thank you</h1><p class="body muted center">${S.vdup?'This session was already submitted. ':''}Your identity verification and consent have been submitted successfully.</p><div class="ref"><div class="small muted">Signatory ${n}</div><div class="h2 ref-no">Verification &amp; Consent Completed</div></div><p class="small muted center">You can close this page. The person who started the transfer will see your updated status.</p>${btn('Open initiator dashboard (demo)','vtoinit','secondary w-281')}</div>`;

if(k===0)b=`<h2 class="h2">Signatory Verification</h2><p class="small muted sub">Complete the following steps to verify your identity and provide consent for this transfer.</p><div class="summary">${row('Session','Signatory '+n)+row('Account','•••• '+a+(nm?' · '+nm:''))+row('Ghana Card',mcard(g.card))+row('Telephone',mphOf(g.phone))+row('Email',mask(g.email))}</div><p class="hint" style="margin-top:12px">This session belongs to Signatory ${n} only. If these are not your details, close this page and contact the person who started the transfer.</p>${btn('Confirm and continue','vstep:1','w-full')}`;
else if(k===1)b=selfieUI(S.vst,S.vsf||0,'vshot','vfail',btn('Continue','vstep:2','w-full'));
else if(k===2)b=`<h2 class="h2">Confirm your Ghana Card</h2><p class="small muted sub">Enter the Ghana Card number registered for Signatory ${n}.</p><div class="list gap14">${fld('Ghana Card number','vcard',{m:'numeric',p:'GHA-000000000-0'})}</div>${btn('Verify Ghana Card','vcardchk','w-full')}<div class="demo">Demo: this signatory’s card is ${e(g.card)}</div>`;
else if(k===3)b=vsigUI(n);
else b=`<h2 class="h2">Give your consent</h2><p class="small muted sub">Read the statement and accept it to finish.</p><div class="summary" style="padding:16px"><p class="small">As Signatory ${n} on account •••• ${e(a)}${nm?' ('+e(nm)+')':''}, I consent to the foreign transfer request started on this account through GCB FXFlow. I authorise GCB Bank to process the request under the account mandate, subject to the Foreign Exchange Transaction Terms and Conditions.</p></div><button class="confirm" data-act="vcons"><span class="tick">${S.vcons?CHK:''}</span><span class="small">I have read the statement above and I give my consent.</span></button>${err('cons')}${btn('Submit Verification &amp; Consent','vsubmit','w-full')}<p class="hint" style="margin-top:12px">Opening this page is not consent. Only this submission counts.</p>`;
return `<div class="content">${top}${b}</div>`};

const msRec=()=>{const R=msLoad(),a=String(S.acct||'').replace(/\D/g,'');return R&&R.acct===a&&R.sigs&&R.sigs.length?R:null};
const msReady=()=>{const R=msRec();return !!R&&R.sigs.every(g=>g.st==='done'&&g.cons&&g.sig)};
const msDecl=()=>{const R=msRec(),dr=(x,y)=>`<div class="row"><span class="small muted">${x}</span><span class="val">${y}</span></div>`;
if(!R)return `<div class="vsigs"><div class="sum-head">Verified Signatories</div><div class="banner miss">We couldn\u2019t find the signatories\u2019 verification records in this browser, so their signatures can\u2019t be shown. In this prototype the records only exist in the browser where the transfer was started.</div>${btn('View Signatory Status','go:sigs','secondary w-full sm')}${err('sig')}</div>`;

const MS={
chksigs:()=>{const er={},sg=S.sg,M=S.mrec||[];sg.forEach((x,i)=>{const p='s'+i;if(x.card.replace(/\D/g,'').length<10)er[p+'card']='Enter the full number, like GHA-000000000-0';if(x.phone.replace(/\D/g,'').length<9)er[p+'phone']='Enter a valid telephone number';if(!/^\S+@\S+\.\S+$/.test(x.email.trim()))er[p+'email']='Enter a valid email address'});
if(!Object.keys(er).length){if(sg[0].card===sg[1].card)er.s1card='Signatory 2 must be a different person from Signatory 1';else sg.forEach((x,i)=>{const r=M.find(m=>m.card===x.card),p='s'+i;if(!r){er[p+'card']='This Ghana Card isn’t on the account mandate';return}if(r.p!==x.phone.replace(/\D/g,'').slice(-9))er[p+'phone']='This doesn’t match the registered telephone number for this signatory';if(r.e!==x.email.trim().toLowerCase())er[p+'email']='This doesn’t match the registered email address for this signatory'})}
if(Object.keys(er).length){er.sg='Check the highlighted fields and try again.';S.er=er;return render()}
const a=S.acct.replace(/\D/g,''),L=sg.map(x=>({card:x.card,phone:x.phone.replace(/\D/g,'').slice(-9),email:x.email.trim().toLowerCase()}));let R=msLoad();
if(!(R&&R.acct===a&&R.sigs&&R.sigs.every((g,i)=>g.card===L[i].card&&g.phone===L[i].phone&&g.email===L[i].email)))R={acct:a,sigs:L.map((x,i)=>Object.assign({n:i+1,tok:newTok(),st:'pending',sel:false,idc:false,cons:false,sentAt:Date.now(),resent:0},x))};
R.ctx={acct:S.acct,phone:S.phone,email:S.email,aname:S.aname,lk:S.lk,sg:S.sg};msSave(R);S.er={};S.lnk={};S.modal=true;render()},

lnk:v=>{S.lnk=S.lnk||{};S.lnk[v]=!S.lnk[v];render()},
resend2:v=>{const R=msLoad();if(!R||!R.sigs[+v])return render();const g=R.sigs[+v];g.resent=(g.resent||0)+1;g.sentAt=Date.now();msSave(R);render();toast('Demo: Signatory '+(+v+1)+' link marked as resent. No real message was sent.')},

vstep:v=>{if(+v===1)msUpd(S.vtok,g=>{if(g.st==='pending')g.st='progress'});S.vstep=+v;S.er={};render('fwd')},
vback:()=>{S.vstep=Math.max(0,(S.vstep||0)-1);S.er={};render('back')},
vshot:()=>{const t=S.vtok;S.vst='chk';render();setTimeout(()=>{msUpd(t,g=>{g.sel=true;if(g.st==='pending')g.st='progress'});if(S.vtok===t){S.vst='ok';if(cur==='sigv')render()}},1400)},
vfail:()=>{S.vsf=(S.vsf||0)+1;S.vst='fail';render()},
vcardchk:()=>{const R=msLoad(),i=sigIdx(R,S.vtok);if(i<0)return render();const g=R.sigs[i],o=R.sigs[1-i],v=S.vcard||'';if(v.replace(/\D/g,'').length<10){S.er={vcard:'Enter the full number, like GHA-000000000-0'};return render()}if(o&&v===o.card){S.er={vcard:'This Ghana Card belongs to the other signatory. Only they can use it, through their own link.'};return render()}if(v!==g.card){S.er={vcard:'This doesn’t match the Ghana Card registered for this signatory.'};return render()}if(!g.sel){S.er={};S.vstep=1;return render('back')}g.idc=true;if(g.st!=='done')g.st='idok';msSave(R);S.er={};S.vstep=3;render('fwd')},
vtab:v=>{S.vsMode=v;render()},vclear:()=>{S.vsD='';render()},vsigok:()=>{S.vsOk=!S.vsOk;render()},

vsubmit:()=>{if(!S.vcons){S.er={cons:'Tick the box to give your consent'};return render()}const R=msLoad(),i=sigIdx(R,S.vtok);if(i<0)return render();const g=R.sigs[i];if(g.st==='done'){S.vdup=true;S.vstep=5;return render()}if(!(g.sel&&g.idc)){S.er={};S.vstep=g.sel?2:1;return render('back')}const up=S.vsMode==='up',img=up?S.vsU:S.vsD;if(!img){S.er={};S.vstep=3;return render('back')}g.st='done';g.cons=true;g.sigType=up?'upload':'drawn';g.sig=img.length<900000?img:'';g.at=new Date().toISOString();msSave(R);S.er={};S.vstep=5;render('fwd')},

};
